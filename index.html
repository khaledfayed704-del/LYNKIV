<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quero</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a14;--sf:#0f1424;--sf2:#161c33;--ln:#252d4a;--tx:#eef2ff;--mu:#98a2c3;--ac:#7c6bff;--ac2:#2ee6c5;--ac3:#ffb347;--sh:0 20px 60px #0009;--orb:.5;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f2f4fb;--sf:#fff;--sf2:#edf0fa;--ln:#d9def0;--tx:#12152b;--mu:#5b6489;--ac:#5b4bf0;--ac2:#0fb59b;--ac3:#f08a1c;--sh:0 20px 50px #2a3a8026;--orb:.28;color-scheme:light}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100%;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic','Manrope',system-ui,sans-serif;overflow-x:hidden;transition:background .5s,color .5s}
:root[lang="en"] body{font-family:'Manrope','IBM Plex Sans Arabic',system-ui,sans-serif}
.en{font-family:'Manrope','IBM Plex Sans Arabic',sans-serif;direction:ltr;display:inline-block}
.orb{position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:var(--orb);z-index:0;pointer-events:none;animation:drift 22s ease-in-out infinite alternate}
.o1{background:var(--ac);top:-18vmax;inset-inline-end:-14vmax}
.o2{background:var(--ac2);bottom:-22vmax;inset-inline-start:-16vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.15)}}
.ctrl{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-end:14px;display:flex;gap:8px}
.ic{width:42px;height:42px;border-radius:14px;border:1px solid var(--ln);background:color-mix(in srgb,var(--sf) 82%,transparent);backdrop-filter:blur(12px);color:var(--tx);display:grid;place-items:center;cursor:pointer;font:700 .8rem Manrope;transition:.3s}
.ic:hover{transform:translateY(-2px) rotate(-6deg);border-color:var(--ac)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.ic .mo{display:none}:root[data-theme="light"] .ic .mo{display:block}:root[data-theme="light"] .ic .su{display:none}
.screen{display:none;position:relative;z-index:1;min-height:100vh;width:100%;max-width:1040px;margin:0 auto;padding:78px clamp(18px,4vw,40px) 44px;flex-direction:column}
.screen.on{display:flex}
.screen.on>*:not(.geo),.hero>*{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*75ms + 280ms)}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
#wipe{position:fixed;inset:0;z-index:60;pointer-events:none;background:linear-gradient(115deg,var(--ac),var(--ac2) 60%,var(--ac3));transform:translateX(110%) skewX(-12deg)}
#wipe.run{animation:wipe .8s cubic-bezier(.75,0,.2,1)}
@keyframes wipe{0%{transform:translateX(110%) skewX(-12deg)}48%,52%{transform:translateX(0) skewX(0)}100%{transform:translateX(-110%) skewX(12deg)}}
h1{font-size:clamp(1.9rem,5.4vw,3rem);font-weight:700;line-height:1.3;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:700}
.sub{color:var(--mu);line-height:1.9;margin-top:10px;font-size:clamp(.95rem,2vw,1.05rem)}
.grad{background:linear-gradient(100deg,var(--ac),var(--ac2) 55%,var(--ac3));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% auto;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 18px;border-radius:16px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:600 .95rem inherit;font-family:inherit;text-decoration:none;cursor:pointer;transition:.3s}
.btn:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:var(--sh)}
.btn.main{background:linear-gradient(100deg,var(--ac),var(--ac2));color:#04061a;border:0;width:100%;max-width:420px;padding:17px;font-size:1.05rem;font-weight:700;margin-top:26px;box-shadow:0 12px 34px color-mix(in srgb,var(--ac) 45%,transparent);position:relative;overflow:hidden}
.btn.main::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff6 50%,transparent 70%);transform:translateX(-120%);animation:glint 3.4s infinite}
@keyframes glint{60%,100%{transform:translateX(120%)}}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-visible,.card:focus-visible,.ic:focus-visible{outline:2px solid var(--ac2);outline-offset:3px}
.link{background:none;border:0;color:var(--mu);font:inherit;cursor:pointer;padding:8px 0;align-self:flex-start;transition:.25s;display:flex;gap:8px;align-items:center}
.link:hover{color:var(--tx);gap:12px}
.arr{display:inline-block}:root[dir="ltr"] .arr{transform:scaleX(-1)}
/* intro */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;max-width:640px;margin:0 auto;width:100%}
.hex{position:relative;width:min(62vw,270px);aspect-ratio:1;margin-bottom:30px;--h:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hex::before{content:'';position:absolute;inset:-6px;clip-path:var(--h);background:conic-gradient(from 0deg,var(--ac),var(--ac2),var(--ac3),var(--ac));animation:spin 7s linear infinite}
.hex::after{content:'';position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac2) 40%,transparent),transparent 65%);z-index:-1;animation:pulse 4s ease-in-out infinite}
.hex img{position:relative;width:100%;height:100%;object-fit:cover;clip-path:var(--h);display:block;animation:fl 6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fl{50%{transform:translateY(-7px)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.6}}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.chip{padding:9px 16px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);font-size:.85rem;color:var(--mu);display:flex;align-items:center;gap:8px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--ac2);box-shadow:0 0 12px var(--ac2)}
/* menu */
.grid3{display:grid;gap:18px;margin-top:28px;grid-template-columns:1fr}
.opt{display:flex;flex-direction:column;padding:0;overflow:hidden;background:var(--sf);border:1px solid var(--ln);border-radius:24px;color:inherit;text-align:start;width:100%;font-family:inherit;cursor:pointer;transition:.4s cubic-bezier(.2,.8,.2,1)}
.opt:hover{transform:translateY(-8px);border-color:var(--ac);box-shadow:var(--sh)}
.opt .ph{display:block;background:#fafbff;padding:18px 22px;border-bottom:2px solid var(--ac)}
.opt .ph.art{padding:0;background:none}
.opt img{display:block;width:100%;height:auto;max-height:150px;object-fit:contain;mix-blend-mode:multiply}
.opt svg.bn{display:block;width:100%;height:auto}
.opt .cap{display:block;padding:16px 22px 20px}
.opt b{display:block;font-size:1.15rem}.opt small{color:var(--mu);font-size:.85rem}
/* login */
#login{overflow:hidden;--tx:#f3f6ff;--mu:#a9b3d9;--ln:#2a3370;--sf:#0e1230;max-width:none;color:var(--tx)}
#login .ic{color:var(--tx)}
.geo{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(600px 420px at 80% 12%,#5b8cff40,transparent 65%),radial-gradient(500px 400px at 10% 80%,#ff3da640,transparent 65%),linear-gradient(180deg,#02030d,#0a0f33 60%,#160a33)}
.geo .stars{position:absolute;inset:0;width:100%;height:100%}
.geo .tw1{animation:tw 3s ease-in-out infinite}.geo .tw2{animation:tw 4.5s ease-in-out infinite 1.2s}
@keyframes tw{50%{opacity:.25}}
.planet{position:absolute;top:70px;left:-30px;width:190px;animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(18px) rotate(3deg)}}
.orbit{position:absolute;right:-90px;bottom:40px;width:260px;animation:spin 50s linear infinite}
.shoot{position:absolute;top:12%;right:-10%;width:130px;height:2px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(-30deg);opacity:0;animation:sh 7s linear infinite 2s}
@keyframes sh{0%{transform:translate(0,0) rotate(-30deg);opacity:0}4%{opacity:1}14%{transform:translate(-520px,300px) rotate(-30deg);opacity:0}100%{opacity:0}}


#login>*:not(.geo){position:relative;z-index:1}
#login .lcard{max-width:460px;width:100%;margin-inline:auto}
.lcard{margin-top:auto;margin-bottom:auto;padding:34px 26px;background:#0a0f2ccf;backdrop-filter:blur(16px);border:1px solid #2ee6c555;border-radius:28px;box-shadow:0 0 80px #7c6bff40,inset 0 0 40px #2ee6c50d}
.lcard::before{content:'';display:block;height:4px;width:70px;border-radius:9px;background:linear-gradient(90deg,#ff3da6,var(--ac),var(--ac2));margin-bottom:22px}
label{display:block;font-size:.85rem;color:var(--mu);margin:20px 0 8px}
.fld{position:relative}
.fld svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--mu);fill:none;stroke-width:2}
input,textarea{width:100%;padding:15px 14px;border-radius:14px;border:1px solid var(--ln);background:color-mix(in srgb,var(--tx) 5%,transparent);color:var(--tx);font:1rem 'Manrope','IBM Plex Sans Arabic';transition:.3s}
.fld input{padding-inline-start:46px}
input:focus,textarea:focus{border-color:var(--ac2);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac2) 20%,transparent)}
input::placeholder,textarea::placeholder{color:var(--mu);font-weight:300;opacity:.7;font-family:'IBM Plex Sans Arabic','Manrope'}
textarea{resize:none}
.err{color:#ff7b8a;font-size:.85rem;margin-top:12px;min-height:1.2em}
/* subjects */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px}
.cards{display:grid;gap:16px;margin-top:26px;grid-template-columns:1fr}
.card{display:flex;align-items:center;gap:18px;padding:18px;background:var(--sf);border:1px solid var(--ln);border-radius:24px;color:inherit;font-family:inherit;text-align:start;cursor:pointer;transition:.4s cubic-bezier(.2,.8,.2,1);width:100%;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,color-mix(in srgb,var(--c) 22%,transparent));opacity:0;transition:.4s}
.card:hover{transform:translateY(-6px);border-color:var(--c);box-shadow:0 16px 50px color-mix(in srgb,var(--c) 28%,transparent)}
.card:hover::before{opacity:1}
.card svg{width:84px;height:84px;flex:none;transition:.4s;position:relative}
.card:hover svg{transform:scale(1.08) rotate(-4deg)}
.card b{display:block;font-size:1.15rem;position:relative}.card small{color:var(--mu);font-size:.85rem;position:relative}
.go{margin-inline-start:auto;color:var(--c);font-size:1.4rem;position:relative}
/* devs/rate */
.hdr{display:block;width:100%;height:auto;margin-bottom:22px;border-radius:24px;border:1px solid var(--ln)}
.dgrid{display:grid;gap:18px;margin-top:24px;grid-template-columns:1fr}
.dev{background:var(--sf);border:1px solid var(--ln);border-radius:26px;padding:24px;transition:.4s}
.dev:hover{border-color:var(--ac);transform:translateY(-4px);box-shadow:var(--sh)}
.dev .hd{display:flex;align-items:center;gap:14px}
.av{width:60px;height:60px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04061a;font:800 1.5rem Manrope;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:none}
.dev h3{font:800 1.4rem Manrope}
.role{color:var(--ac2);font-size:.85rem;font-weight:600}
.dev p{color:var(--mu);font-size:.92rem;line-height:1.8;margin:14px 0}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ct .btn{padding:13px 10px;font-size:.9rem}
.ct .wa{background:#1fa855;border-color:#1fa855;color:#fff}.ct .tk{background:#fff;color:#04061a;border-color:#fff}
.num{grid-column:1/-1;text-align:center;font:600 1.05rem Manrope;letter-spacing:.05em;padding:11px;border:1px dashed var(--ln);border-radius:14px;direction:ltr}
.stars{display:flex;gap:6px;margin-top:10px;direction:ltr}
.stars button{background:none;border:0;cursor:pointer;padding:2px;font-size:2rem;line-height:1;color:var(--ln);transition:.25s}
.stars button:hover{transform:scale(1.2)}.stars button.on{color:#f5c518;transform:scale(1.12);text-shadow:0 0 14px #f5c51888}
.thanks{text-align:center;margin-top:20px;padding:24px;border:1px solid var(--ac2);border-radius:20px}
.thanks .big{font:800 2.4rem Manrope;color:var(--ac2)}
/* solve */
.solve{justify-content:center;align-items:center;text-align:center}
.gauge{position:relative;width:min(78vw,340px);aspect-ratio:1;margin:26px auto 8px}
.gauge svg{width:100%;height:100%;display:block;overflow:visible}
.gauge .center{position:absolute;inset:0;display:grid;place-content:center}
.pct{font:800 clamp(2.6rem,12vw,3.8rem) Manrope;line-height:1;background:linear-gradient(100deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pct small{font-size:.45em}
.slow{transform-origin:120px 120px;animation:spin 30s linear infinite}
.slow2{transform-origin:120px 120px;animation:spin 18s linear infinite reverse}
.gauge.fin{filter:drop-shadow(0 0 24px var(--ac2))}
.status{font-size:1.3rem;font-weight:600;margin-top:12px}
.dots::after{content:'';animation:d 1.2s steps(4) infinite}
@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.sal{font-size:.72rem;color:var(--mu);margin-top:10px;letter-spacing:.04em;opacity:.85}
.dots.off::after{content:''!important;animation:none}
@media(min-width:720px){.grid3{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(3,1fr)}.card{flex-direction:column;text-align:center;padding:28px 18px}.card svg{width:104px;height:104px}.go{display:none}.dgrid{grid-template-columns:1fr 1fr}.hdr{max-height:220px;object-fit:cover}}
@media(min-width:1100px){.screen{padding-top:96px}}
@media(max-width:380px){.ct{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v4 fantasy ===== */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--hx:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#cur{position:fixed;left:0;top:0;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;z-index:0;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 22%,transparent),transparent 65%);opacity:0;transition:opacity .4s;will-change:transform}
#toast{position:fixed;z-index:80;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,40px);opacity:0;padding:12px 20px;border-radius:99px;background:linear-gradient(100deg,var(--ac),var(--ac2));color:#04061a;font-weight:700;font-size:.9rem;box-shadow:var(--sh);transition:.45s cubic-bezier(.2,.8,.2,1);pointer-events:none;white-space:nowrap}
#toast.show{transform:translate(-50%,0);opacity:1}
@keyframes rise{from{opacity:0;transform:perspective(900px) translateY(44px) rotateX(16deg) scale(.95);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
#wipe{transform:none;background:radial-gradient(circle at var(--px,50%) var(--py,50%),var(--ac2),var(--ac) 38%,#240a5a 85%);clip-path:circle(0 at var(--px,50%) var(--py,50%));opacity:0}
#wipe.run{animation:portal .95s cubic-bezier(.65,0,.25,1)}
@keyframes portal{0%{clip-path:circle(0 at var(--px) var(--py));opacity:1}48%{clip-path:circle(150% at var(--px) var(--py));opacity:1}100%{clip-path:circle(150% at var(--px) var(--py));opacity:0}}
.btn{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:#fff6;transform:scale(0);animation:rp .7s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4.5);opacity:0}}
.btn.main{background:#0a0e24;color:#fff;border:0;isolation:isolate;box-shadow:0 0 0 1px #ffffff1a,0 14px 44px color-mix(in srgb,var(--ac) 55%,transparent);letter-spacing:.02em}
.btn.main::before{content:'';position:absolute;inset:-70%;z-index:-2;background:conic-gradient(from 0deg,var(--ac),var(--ac2),var(--ac3),#ff3da6,var(--ac));animation:spin 4s linear infinite}
.btn.main::after{content:'';position:absolute;inset:2px;border-radius:14px;z-index:-1;background:linear-gradient(135deg,#141a48,#090c20);transform:none;animation:none;transition:.4s}
.btn.main:hover::after{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 60%,#141a48),#090c20)}
.btn.main:hover{transform:translateY(-4px) scale(1.02)}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;background:none;border:0;color:var(--tx);font:600 .95rem inherit;font-family:inherit;cursor:pointer;padding:4px 0;margin-bottom:8px}
.back .bi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ln);background:color-mix(in srgb,var(--sf) 80%,transparent);backdrop-filter:blur(10px);transition:.4s cubic-bezier(.2,.8,.2,1)}
.back svg,.btn .bk{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:.35s}
:root[dir="rtl"] .back svg,:root[dir="rtl"] .btn .bk{transform:scaleX(-1)}
.back:hover .bi{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04061a;border-color:transparent;transform:scale(1.1);box-shadow:0 8px 24px color-mix(in srgb,var(--ac) 45%,transparent)}
.back:hover svg{transform:translateX(-3px)}:root[dir="rtl"] .back:hover svg{transform:scaleX(-1) translateX(-3px)}
#login .back{width:100%;max-width:460px;margin-inline:auto;align-self:center;color:var(--tx)}
.tilt{position:relative;transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}
.tilt::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--ac2) 26%,transparent),transparent 62%);opacity:0;transition:opacity .3s;pointer-events:none}
.tilt:hover::after{opacity:1}
.ob{position:absolute;inset:0;animation:spin 18s linear infinite;pointer-events:none}
.ob span{position:absolute;top:50%;left:50%;width:46px;height:46px;margin:-23px;transform:rotate(var(--a)) translateY(calc(-1*(min(31vw,135px) + 48px))) rotate(calc(-1*var(--a)));filter:drop-shadow(0 6px 14px #0007)}
.ob svg{width:46px;height:46px;display:block;animation:spin 18s linear infinite reverse}
.hex::after{inset:-60px}
.lcard{position:relative}
.lcard::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),#ff3da6,var(--ac),var(--ac2),#ff3da6);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ang 6s linear infinite;pointer-events:none}
@keyframes ang{to{--ang:360deg}}
.lcard{border:0}
.hint{font-size:.78rem;color:var(--mu);margin-top:8px;font-weight:300;transition:.3s}.hint.bad{color:#ff7b8a;font-weight:600}
.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.eye{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--mu);cursor:pointer;display:grid;place-items:center;border-radius:10px}
.eye:hover{color:var(--ac2)}.eye svg{position:static;transform:none;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.dev{position:relative;overflow:hidden;padding:26px}
.dev .aura{position:absolute;width:230px;height:230px;border-radius:50%;inset-inline-end:-80px;top:-80px;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 45%,transparent),transparent 65%);filter:blur(10px);pointer-events:none}
.dev>*{position:relative}.dev>.aura{position:absolute}
.avw{position:relative;width:70px;height:70px;display:grid;place-items:center;flex:none}
.avw::before{content:'';position:absolute;inset:0;clip-path:var(--hx);background:conic-gradient(var(--ac),var(--ac2),var(--ac3),var(--ac));animation:spin 6s linear infinite}
.avw .av{width:64px;height:64px;position:relative;font-size:1.6rem}
.role{display:flex;align-items:center;gap:8px}
.role .dot{width:8px;height:8px;border-radius:50%;background:#35e08a;box-shadow:0 0 0 0 #35e08a99;animation:ping 2s infinite;flex:none}
@keyframes ping{70%{box-shadow:0 0 0 9px #35e08a00}100%{box-shadow:0 0 0 0 #35e08a00}}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tags span{font:600 .75rem Manrope;padding:5px 12px;border-radius:99px;background:color-mix(in srgb,var(--ac) 16%,transparent);border:1px solid color-mix(in srgb,var(--ac) 38%,transparent)}
